<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legacy AI Binder Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
        padding: 24px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      .form-group {
        margin-bottom: 14px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Legacy form demo</h2>
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" value="Ada Lovelace" />
      </div>

      <div class="form-group">
        <label for="emailAddress">Email address</label>
        <input id="emailAddress" name="emailAddress" type="email" value="ada@example.com" />
      </div>

      <div class="form-group">
        <label>Preferred plan</label>
        <select name="plan">
          <option value="basic">Basic</option>
          <option value="pro" selected>Pro</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes">Initial draft</textarea>
      </div>

      <div class="form-group">
        <label><input type="checkbox" name="marketing" checked /> Receive updates</label>
      </div>

      <button type="button">Save</button>
    </div>

    <script src="./stepmappers.js"></script>
    <script>
      window.addEventListener('load', function () {
        var engine = window.LegacyAIBindingEngine;
        if (engine && engine.captureCurrentFormState) {
          console.log('Captured fields:', engine.captureCurrentFormState(document));
        }
      });
    </script>
  </body>
</html>
